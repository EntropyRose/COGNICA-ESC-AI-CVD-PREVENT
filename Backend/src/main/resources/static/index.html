<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognica Decision Problem Builder</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(67, 83, 97, 0.1);
    }

    .detail-section:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .detail-content {
      padding: 12px;
      background: rgba(239, 245, 251, 0.78);
      border-radius: var(--radius-sm);
      color: var(--ink);
      word-break: break-word;
      font-size: 0.95rem;
      border: 1px solid rgba(62, 76, 92, 0.18);
      white-space: pre-wrap;
      font-family: 'Monaco', 'Courier New', monospace;
      max-height: 170px;
      overflow-y: auto;
    }

    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-badge {
      display: inline-block;
      padding: 6px 11px;
      background: rgba(58, 103, 196, 0.12);
      border: 1px solid rgba(44, 79, 155, 0.2);
      border-radius: 999px;
      color: #1f3155;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .facts-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .facts-table th,
    .facts-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(67, 83, 97, 0.15);
    }

    .facts-table th {
      background: rgba(239, 245, 251, 0.78);
      font-weight: 700;
      color: #22344a;
      font-size: 0.9rem;
    }

    .fact-true {
      color: #2c5e2e;
      font-weight: 600;
    }

    .fact-false {
      color: #5e2c2e;
    }

    .response-label {
      font-weight: 700;
      color: #22344a;
      margin-bottom: 10px;
    }

    .response-content {
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
    }

    .dp-preview-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.66);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
    }

    .dp-preview-backdrop.active {
      display: flex;
    }

    .dp-preview-modal {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(250, 252, 255, 0.98);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      padding: 24px;
    }

    .dp-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .dp-picker-header label {
      margin-bottom: 0;
    }

    .dp-preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .dp-preview-title {
      margin: 0;
      font-size: 1.2rem;
      color: var(--ink);
    }

    .dp-preview-close {
      background: transparent;
      border: 1px solid rgba(62, 76, 92, 0.2);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .name-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input-row input {
      flex: 1;
      margin: 0;
    }

    .name-input-row button {
      margin: 0;
      white-space: nowrap;
    }

    .facts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .fact-input {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(62, 76, 92, 0.16);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.88);
      align-items: center;
    }

    .fact-input.internal-fact-input {
      grid-column: 1 / -1;
      grid-template-columns: 1fr minmax(240px, 320px) minmax(140px, 170px) auto;
    }

    .fact-input .fact-text {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(62, 76, 92, 0.18);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      min-width: 0;
    }

    .fact-status-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(62, 76, 92, 0.72);
      font-size: 0.92rem;
    }

    .fact-status-select,
    .factor-rp-source {
      font-size: 0.95rem;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(62, 76, 92, 0.18);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .fact-status-select:focus,
    .factor-rp-source:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .fact-unknown {
      color: #7d6e46;
      font-weight: 600;
    }

    .fact-input-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .fact-input-footer .fact-hold-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
      white-space: nowrap;
    }

    .fact-input-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .fact-input-actions button,
    .facts-actions-row button {
      padding: 6px 10px;
      min-width: auto;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(58, 103, 196, 0.35);
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .fact-input-actions button:hover,
    .facts-actions-row button:hover {
      background: linear-gradient(135deg, #3458a8, #23407f);
    }

    .facts-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .plain-text-panel {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid rgba(62, 76, 92, 0.16);
      border-radius: var(--radius-md);
      background: rgba(247, 249, 253, 0.95);
    }

    .plain-text-panel.active {
      display: block;
    }

    .plain-text-panel textarea {
      width: 100%;
      min-height: 160px;
      padding: 12px;
      border: 1px solid rgba(62, 76, 92, 0.18);
      border-radius: var(--radius-sm);
      resize: vertical;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .plain-text-panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .plain-text-panel-actions button {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      border: 1px solid rgba(62, 76, 92, 0.18);
      background: white;
    }
  </style>
</head>

<body>

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px;">
  <div>
    <h1>Cognica Decision Problem Builder</h1>
    <p style="color: var(--muted); margin-top: -12px; margin-bottom: 20px; max-width: 62ch;">
      Build and store decision problems here.
    </p>
    <div style="margin-top: -6px; margin-bottom: 20px;">
      <a id="openQueryCenterLink" href="query.html" style="color: var(--accent); font-weight: 700; text-decoration: none;">Open Query Center →</a>
    </div>
  </div>
  <button type="button" style="background: linear-gradient(135deg, #a93226, #c0392b); color: white; border: none; border-radius: var(--radius-md); padding: 12px 20px; cursor: pointer; font-weight: 600; font-size: 0.95rem; white-space: nowrap; margin-top: 8px;" onclick="window.location.href='clinical-query.html'">Clinical Query Assistant</button>
</div>

<section id="decisionProblemBuilder">
  <h2>Decision Problem Input</h2>

  <div class="dp-toolbar">
    <div class="dp-picker-group">
      <div class="dp-picker-header">
        <label for="dpSelect">Active Decision Problem</label>
      </div>
      <select id="dpSelect"></select>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button type="button" id="newDpBtn">Create New Decision Problem</button>
      <button type="button" id="deleteDpBtn" style="background: #d1735e; color: white; border: none; border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer;">Delete Selected</button>
    </div>
  </div>

  <div class="form-group">
    <label for="dpNameInput">Decision Problem Name</label>
    <div class="name-input-row">
      <input type="text" id="dpNameInput" placeholder="Name this decision problem">
      <button type="button" id="previewDpBtn">Preview Decision Problem</button>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="policyInput">Policy (Cognica DP CNL)</label>
      <textarea id="policyInput" rows="10" placeholder="Enter policy statements"></textarea>
    </div>
    <div class="form-group">
      <label for="descriptionInput">Natural Language</label>
      <textarea id="descriptionInput" rows="10" placeholder="Describe this decision problem in natural language"></textarea>
    </div>
  </div>

  <div class="dp-options-preview">
    <strong>Possible options for this decision problem:</strong>
    <div id="dpOptionsList" class="option-pills"></div>
  </div>

  <div class="form-group">
    <label for="optionsInput">Complementary Options (comma-separated)</label>
    <input type="text" id="optionsInput" placeholder="option1, option2, option3">
  </div>

  <div class="form-group">
    <label>External Factors</label>
    <div id="externalFactorsContainer" class="facts-grid"></div>
    <div class="facts-actions-row">
      <button type="button" id="addExternalFactorBtn">Add External Factor</button>
      <button type="button" id="togglePlainTextFactorsBtn">Enter plain text</button>
    </div>
  </div>

  <div class="form-group">
    <label>Internal Factors</label>
    <div id="internalFactorsContainer" class="facts-grid"></div>
    <div class="facts-actions-row">
      <button type="button" id="addInternalFactorBtn">Add Internal Factor</button>
    </div>
    <div id="plainTextFactorsPanel" class="plain-text-panel">
      <label for="plainTextFactorsInput" style="font-weight:700; margin-bottom:8px; display:block;">Paste one factor per line</label>
      <textarea id="plainTextFactorsInput" placeholder="Factor one\nFactor two\nFactor three"></textarea>
      <div class="plain-text-panel-actions">
        <button type="button" id="applyPlainTextFactorsBtn">Import Factors</button>
        <button type="button" id="cancelPlainTextFactorsBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
    <button id="saveRequestBtn" type="button" style="background: #6b9e3a; color: white; border: none; border-radius: var(--radius-sm); padding: 12px; font-weight: 600; cursor: pointer;">Save Decision Problem</button>
    <button id="goToQueryCenterBtn" type="button">Go to Query Center</button>
  </div>

  <div id="saveStatus"></div>
</section>

<div id="dpPreviewBackdrop" class="dp-preview-backdrop">
  <div class="dp-preview-modal">
    <div class="dp-preview-header">
      <h3 id="dpPreviewTitle" class="dp-preview-title">Decision Problem Preview</h3>
      <button type="button" id="closePreviewBtn" class="dp-preview-close">Close</button>
    </div>
    <div id="dpPreviewContent"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const policyInputEl = document.getElementById('policyInput');
  const optionsInputEl = document.getElementById('optionsInput');
  const descriptionInputEl = document.getElementById('descriptionInput');
  const externalFactorsContainerEl = document.getElementById('externalFactorsContainer');
  const internalFactorsContainerEl = document.getElementById('internalFactorsContainer');
  const dpSelectEl = document.getElementById('dpSelect');
  const dpNameInputEl = document.getElementById('dpNameInput');
  const newDpBtnEl = document.getElementById('newDpBtn');
  const deleteDpBtnEl = document.getElementById('deleteDpBtn');
  const addExternalFactorBtnEl = document.getElementById('addExternalFactorBtn');
  const addInternalFactorBtnEl = document.getElementById('addInternalFactorBtn');
  const previewDpBtnEl = document.getElementById('previewDpBtn');
  const optionsListEl = document.getElementById('dpOptionsList');
  const saveRequestBtnEl = document.getElementById('saveRequestBtn');
  const saveStatusEl = document.getElementById('saveStatus');
  const goToQueryCenterBtnEl = document.getElementById('goToQueryCenterBtn');
  const togglePlainTextFactorsBtnEl = document.getElementById('togglePlainTextFactorsBtn');
  const plainTextFactorsPanelEl = document.getElementById('plainTextFactorsPanel');
  const plainTextFactorsInputEl = document.getElementById('plainTextFactorsInput');
  const applyPlainTextFactorsBtnEl = document.getElementById('applyPlainTextFactorsBtn');
  const cancelPlainTextFactorsBtnEl = document.getElementById('cancelPlainTextFactorsBtn');
  const openQueryCenterLinkEl = document.getElementById('openQueryCenterLink');
  const dpPreviewBackdropEl = document.getElementById('dpPreviewBackdrop');
  const dpPreviewTitleEl = document.getElementById('dpPreviewTitle');
  const dpPreviewContentEl = document.getElementById('dpPreviewContent');
  const closePreviewBtnEl = document.getElementById('closePreviewBtn');

  const decisionProblems = [];
  let activeDecisionProblemId = null;

  async function loadStoredRequestsFromDatabase() {
    try {
      const storedDps = await window.cognicaAPI.getAllStoredRequests();
      decisionProblems.length = 0; // Clear existing
      
      storedDps.forEach((dp, index) => {
        const factors = dp.factsJson ? JSON.parse(dp.factsJson) : [];
        const externalFactors = factors.filter(item => item.factType !== 'internal');
        const internalFactors = factors.filter(item => item.factType === 'internal');
        const options = dp.complementaryOptionsJson ? JSON.parse(dp.complementaryOptionsJson) : [];
        
        decisionProblems.push({
          id: `dp-${dp.id}`,
          name: dp.name || `Decision Problem ${index + 1}`,
          storedRequestId: dp.id,
          naturalLanguage: dp.naturalLanguage || '',
          policy: dp.originalPolicyInCognicaDPCNL || dp.policyInCognicaDPCNL || '',
          transformedPolicy: dp.policyInCognicaDPCNL || '',
          optionsText: options.join(', '),
          externalFactors,
          internalFactors
        });
      });
      
      if (decisionProblems.length > 0) {
        activeDecisionProblemId = decisionProblems[0].id;
        renderDecisionProblemPicker();
        loadActiveDecisionProblemToForm();
      }
    } catch (error) {
      console.error('Error loading stored requests:', error);
    }
  }

  function createDecisionProblem(name) {
    return {
      id: `dp-${Date.now()}-${Math.floor(Math.random() * 10000)}`,
      name,
      storedRequestId: null,
      naturalLanguage: '',
      policy: '',
      transformedPolicy: '',
      optionsText: '',
      externalFactors: [],
      internalFactors: []
    };
  }

  function getActiveDecisionProblem() {
    return decisionProblems.find(dp => dp.id === activeDecisionProblemId) || null;
  }

  function parseOptions(optionsText) {
    return optionsText
      .split(',')
      .map(opt => opt.trim())
      .filter(opt => opt);
  }

  function buildPreviewRequest(activeDp) {
    return {
      id: activeDp?.storedRequestId || activeDp?.id,
      name: activeDp?.name || 'Untitled decision problem',
      naturalLanguage: activeDp?.naturalLanguage || '',
      originalPolicyInCognicaDPCNL: activeDp?.policy || '',
      policyInCognicaDPCNL: activeDp?.transformedPolicy || activeDp?.policy || '',
      complementaryOptionsJson: JSON.stringify(parseOptions(activeDp?.optionsText || '')),
      factsJson: JSON.stringify([
        ...(Array.isArray(activeDp?.externalFactors) ? activeDp.externalFactors : []),
        ...(Array.isArray(activeDp?.internalFactors) ? activeDp.internalFactors : [])
      ]),
      lastResponseJson: null
    };
  }

  function getEffectiveFactStatus(item) {
    if (item && typeof item.factStatus === 'string') {
      const normalized = item.factStatus.trim().toLowerCase();
      if (normalized === 'true' || normalized === 'false' || normalized === 'unknown') {
        return normalized;
      }
    }
    return item && item.factHold ? 'true' : 'false';
  }

  function showDecisionProblemPreview() {
    captureFormIntoActiveDecisionProblem();
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      showSaveStatus('No decision problem available to preview.', true);
      return;
    }

    dpPreviewTitleEl.textContent = activeDp.name || 'Decision Problem Preview';
    dpPreviewContentEl.innerHTML = window.cognicaUI.buildDecisionProblemDetailsHtml(buildPreviewRequest(activeDp));
    dpPreviewBackdropEl.classList.add('active');
  }

  function hideDecisionProblemPreview() {
    dpPreviewBackdropEl.classList.remove('active');
  }

  function showSaveStatus(message, isError) {
    const className = isError ? 'error' : 'prediction-result';
    saveStatusEl.innerHTML = `
      <div class="${className}">
        <strong>${isError ? 'Problem:' : 'Saved:'}</strong> ${message}
      </div>
    `;
  }

  function renderDecisionProblemPicker() {
    dpSelectEl.innerHTML = '';

    decisionProblems.forEach((dp, index) => {
      const optionEl = document.createElement('option');
      optionEl.value = dp.id;
      optionEl.textContent = `${index + 1}. ${dp.name}`;
      dpSelectEl.appendChild(optionEl);
    });

    dpSelectEl.value = activeDecisionProblemId;
  }

  function addExternalFactor() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }
    activeDp.externalFactors.push({ fact: '', factHold: false, factStatus: 'unknown', factType: 'external' });
    renderExternalFactorsRows(activeDp.externalFactors);
    const latestFactorInput = externalFactorsContainerEl.querySelector('.fact-input:last-child .fact-text');
    if (latestFactorInput) {
      latestFactorInput.focus();
    }
  }

  function addInternalFactor() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }
    activeDp.internalFactors.push({ fact: '', factHold: false, factStatus: 'unknown', factType: 'internal', internalSourceDp: '' });
    renderInternalFactorsRows(activeDp.internalFactors);
    const latestFactorInput = internalFactorsContainerEl.querySelector('.fact-input:last-child .fact-text');
    if (latestFactorInput) {
      latestFactorInput.focus();
    }
  }

  function buildRpSourceOptions(selectedValue) {
    let options = '<option value="">Select RP source</option>';
    decisionProblems.forEach(dp => {
      const isSelected = dp.id === selectedValue ? 'selected' : '';
      options += `<option value="${dp.id}" ${isSelected}>${dp.name.replace(/"/g, '&quot;')}</option>`;
    });
    return options;
  }

  function renderExternalFactorsRows(factors) {
    externalFactorsContainerEl.innerHTML = '';
    factors.forEach((factorItem, index) => {
      const factDiv = document.createElement('div');
      factDiv.className = 'fact-input';
      factDiv.dataset.index = index;
      const factStatus = factorItem.factStatus || (factorItem.factHold ? 'true' : 'unknown');
      factDiv.innerHTML = `
        <input type="text" class="fact-text" placeholder="Factor description" value="${factorItem.fact.replace(/"/g, '&quot;')}">
        <div class="fact-input-footer">
          <label class="fact-status-row">
            Status
            <select class="fact-status-select">
              <option value="unknown" ${factStatus === 'unknown' ? 'selected' : ''}>Unknown</option>
              <option value="true" ${factStatus === 'true' ? 'selected' : ''}>True</option>
              <option value="false" ${factStatus === 'false' ? 'selected' : ''}>False</option>
            </select>
          </label>
          <div class="fact-input-actions">
            <button type="button" class="remove-factor-btn">Remove</button>
          </div>
        </div>
      `;
      externalFactorsContainerEl.appendChild(factDiv);
    });
    addExternalFactorBtnEl.style.display = factors.length === 0 ? '' : 'inline-flex';
  }

  function renderInternalFactorsRows(factors) {
    internalFactorsContainerEl.innerHTML = '';
    factors.forEach((factorItem, index) => {
      const factDiv = document.createElement('div');
      factDiv.className = 'fact-input internal-fact-input';
      factDiv.dataset.index = index;
      const factStatus = factorItem.factStatus || (factorItem.factHold ? 'true' : 'unknown');
      factDiv.innerHTML = `
        <input type="text" class="fact-text" placeholder="Factor description" value="${factorItem.fact.replace(/"/g, '&quot;')}">
        <select class="factor-rp-source">${buildRpSourceOptions(factorItem.internalSourceDp)}</select>
        <select class="fact-status-select">
          <option value="unknown" ${factStatus === 'unknown' ? 'selected' : ''}>Unknown</option>
          <option value="true" ${factStatus === 'true' ? 'selected' : ''}>True</option>
          <option value="false" ${factStatus === 'false' ? 'selected' : ''}>False</option>
        </select>
        <button type="button" class="remove-factor-btn">Remove</button>
      `;
      internalFactorsContainerEl.appendChild(factDiv);
    });
    addInternalFactorBtnEl.style.display = factors.length === 0 ? '' : 'inline-flex';
  }

  function renderOptionsPreview(optionsText) {
    const options = parseOptions(optionsText);
    optionsListEl.innerHTML = '';

    if (options.length === 0) {
      const emptyEl = document.createElement('span');
      emptyEl.className = 'option-empty';
      emptyEl.textContent = 'No options set yet for this decision problem.';
      optionsListEl.appendChild(emptyEl);
      return;
    }

    options.forEach(optionText => {
      const pillEl = document.createElement('span');
      pillEl.className = 'option-pill';
      pillEl.textContent = optionText;
      optionsListEl.appendChild(pillEl);
    });
  }

  function loadActiveDecisionProblemToForm() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    policyInputEl.value = activeDp.policy;
    descriptionInputEl.value = activeDp.naturalLanguage;
    dpNameInputEl.value = activeDp.name;
    optionsInputEl.value = activeDp.optionsText;
    renderExternalFactorsRows(activeDp.externalFactors);
    renderInternalFactorsRows(activeDp.internalFactors);
    renderOptionsPreview(activeDp.optionsText);
    saveStatusEl.innerHTML = '';
  }

  function captureFormIntoActiveDecisionProblem() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    activeDp.name = dpNameInputEl.value.trim() || activeDp.name;
    activeDp.naturalLanguage = descriptionInputEl.value.trim();
    const updatedPolicy = policyInputEl.value;
    if (activeDp.policy !== updatedPolicy) {
      activeDp.policy = updatedPolicy;
      activeDp.transformedPolicy = '';
    } else {
      activeDp.policy = updatedPolicy;
    }
    activeDp.optionsText = optionsInputEl.value;
    renderOptionsPreview(activeDp.optionsText);
  }

  function createAndActivateDecisionProblem() {
    const dpNumber = decisionProblems.length + 1;
    const newDp = createDecisionProblem(`Decision Problem ${dpNumber}`);
    decisionProblems.push(newDp);
    activeDecisionProblemId = newDp.id;
    renderDecisionProblemPicker();
    loadActiveDecisionProblemToForm();
  }

  async function persistActiveDecisionProblem() {
    captureFormIntoActiveDecisionProblem();
    const activeDp = getActiveDecisionProblem();

    if (!activeDp) {
      return { saved: false, reason: 'No active decision problem.' };
    }

    if (!activeDp.name.trim() || !activeDp.policy.trim()) {
      return { saved: false, reason: 'Name and Policy are required.' };
    }

    const options = parseOptions(activeDp.optionsText);
    const factors = [
      ...(Array.isArray(activeDp.externalFactors) ? activeDp.externalFactors : []),
      ...(Array.isArray(activeDp.internalFactors) ? activeDp.internalFactors : [])
    ].filter(factor => factor.fact && factor.fact.trim());

    const result = activeDp.storedRequestId
      ? await window.cognicaAPI.updateStoredRequest(
          activeDp.storedRequestId,
          activeDp.name.trim(),
          activeDp.naturalLanguage,
          activeDp.policy,
          '',
          options,
          factors
        )
      : await window.cognicaAPI.saveStoredRequest(
          activeDp.name.trim(),
          activeDp.naturalLanguage,
          activeDp.policy,
          '',
          options,
          factors
        );

    if (result.success && result.data && result.data.id) {
      activeDp.storedRequestId = result.data.id;
      return { saved: true, id: result.data.id };
    }

    return { saved: false, reason: result.error || 'Unknown save error.' };
  }

  async function autoSaveAndNavigateToQueryCenter() {
    goToQueryCenterBtnEl.disabled = true;
    const originalText = goToQueryCenterBtnEl.textContent;
    goToQueryCenterBtnEl.textContent = 'Loading...';

    // Try to save if there's an active DP with content, but ignore errors
    const activeDp = getActiveDecisionProblem();
    if (activeDp && activeDp.name.trim() && activeDp.policy.trim()) {
      try {
        const saveResult = await persistActiveDecisionProblem();
        if (saveResult.saved) {
          showSaveStatus(`Auto-saved decision problem (ID ${saveResult.id}). Opening Query Center...`, false);
        }
      } catch (error) {
        // Ignore save errors and navigate anyway
      }
    }

    goToQueryCenterBtnEl.disabled = false;
    goToQueryCenterBtnEl.textContent = originalText;
    window.location.href = 'query.html';
  }

  policyInputEl.addEventListener('input', captureFormIntoActiveDecisionProblem);
  descriptionInputEl.addEventListener('input', captureFormIntoActiveDecisionProblem);
  optionsInputEl.addEventListener('input', captureFormIntoActiveDecisionProblem);

  dpNameInputEl.addEventListener('input', function() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const trimmedName = dpNameInputEl.value.trim();
    activeDp.name = trimmedName || activeDp.name;
    renderDecisionProblemPicker();
    dpSelectEl.value = activeDecisionProblemId;
  });

  dpSelectEl.addEventListener('change', function() {
    captureFormIntoActiveDecisionProblem();
    activeDecisionProblemId = this.value;
    loadActiveDecisionProblemToForm();
  });

  newDpBtnEl.addEventListener('click', function() {
    captureFormIntoActiveDecisionProblem();
    createAndActivateDecisionProblem();
  });

  deleteDpBtnEl.addEventListener('click', async function() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      showSaveStatus('No decision problem selected to delete.', true);
      return;
    }

    if (!activeDp.storedRequestId) {
      showSaveStatus('This decision problem has not been saved yet.', true);
      return;
    }

    if (!confirm(`Are you sure you want to delete "${activeDp.name}"?`)) {
      return;
    }

    deleteDpBtnEl.disabled = true;
    const originalText = deleteDpBtnEl.textContent;
    deleteDpBtnEl.textContent = 'Deleting...';

    const result = await window.cognicaAPI.deleteStoredRequest(activeDp.storedRequestId);

    deleteDpBtnEl.disabled = false;
    deleteDpBtnEl.textContent = originalText;

    if (result.success) {
      showSaveStatus(`Decision problem "${activeDp.name}" deleted.`, false);
      // Reload stored requests and refresh UI
      await loadStoredRequestsFromDatabase();
      if (decisionProblems.length === 0) {
        createAndActivateDecisionProblem();
      }
    } else {
      showSaveStatus(`Failed to delete: ${result.error}`, true);
    }
  });

  addExternalFactorBtnEl.addEventListener('click', addExternalFactor);
  addInternalFactorBtnEl.addEventListener('click', addInternalFactor);

  externalFactorsContainerEl.addEventListener('keydown', function(event) {
    if (!event.target.classList.contains('fact-text') || event.key !== 'Enter') {
      return;
    }

    event.preventDefault();
    addExternalFactor();
  });

  internalFactorsContainerEl.addEventListener('keydown', function(event) {
    if (!event.target.classList.contains('fact-text') || event.key !== 'Enter') {
      return;
    }

    event.preventDefault();
    addInternalFactor();
  });

  externalFactorsContainerEl.addEventListener('input', function(event) {
    const row = event.target.closest('.fact-input');
    if (!row) {
      return;
    }

    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const index = Number(row.dataset.index);
    if (Number.isNaN(index) || !activeDp.externalFactors[index]) {
      return;
    }

    activeDp.externalFactors[index].fact = row.querySelector('.fact-text').value;
  });

  internalFactorsContainerEl.addEventListener('input', function(event) {
    const row = event.target.closest('.fact-input');
    if (!row) {
      return;
    }

    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const index = Number(row.dataset.index);
    if (Number.isNaN(index) || !activeDp.internalFactors[index]) {
      return;
    }

    if (event.target.classList.contains('factor-rp-source')) {
      activeDp.internalFactors[index].internalSourceDp = event.target.value;
      return;
    }

    activeDp.internalFactors[index].fact = row.querySelector('.fact-text').value;
  });

  externalFactorsContainerEl.addEventListener('change', function(event) {
    const row = event.target.closest('.fact-input');
    if (!row) {
      return;
    }

    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const index = Number(row.dataset.index);
    if (Number.isNaN(index) || !activeDp.externalFactors[index]) {
      return;
    }

    if (event.target.classList.contains('fact-status-select')) {
      activeDp.externalFactors[index].factStatus = event.target.value;
      activeDp.externalFactors[index].factHold = event.target.value === 'true';
    }
  });

  internalFactorsContainerEl.addEventListener('change', function(event) {
    if (event.target.classList.contains('factor-rp-source')) {
      const row = event.target.closest('.fact-input');
      if (!row) {
        return;
      }
      const activeDp = getActiveDecisionProblem();
      if (!activeDp) {
        return;
      }
      const index = Number(row.dataset.index);
      if (Number.isNaN(index) || !activeDp.internalFactors[index]) {
        return;
      }
      activeDp.internalFactors[index].internalSourceDp = event.target.value;
      return;
    }

    if (event.target.classList.contains('fact-status-select')) {
      const row = event.target.closest('.fact-input');
      if (!row) {
        return;
      }
      const activeDp = getActiveDecisionProblem();
      if (!activeDp) {
        return;
      }
      const index = Number(row.dataset.index);
      if (Number.isNaN(index) || !activeDp.internalFactors[index]) {
        return;
      }
      activeDp.internalFactors[index].factStatus = event.target.value;
      activeDp.internalFactors[index].factHold = event.target.value === 'true';
    }
  });

  externalFactorsContainerEl.addEventListener('click', function(event) {
    if (!event.target.classList.contains('remove-factor-btn')) {
      return;
    }

    const row = event.target.closest('.fact-input');
    if (!row) {
      return;
    }

    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const index = Number(row.dataset.index);
    if (Number.isNaN(index)) {
      return;
    }

    activeDp.externalFactors.splice(index, 1);
    renderExternalFactorsRows(activeDp.externalFactors);
  });

  internalFactorsContainerEl.addEventListener('click', function(event) {
    if (!event.target.classList.contains('remove-factor-btn')) {
      return;
    }

    const row = event.target.closest('.fact-input');
    if (!row) {
      return;
    }

    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const index = Number(row.dataset.index);
    if (Number.isNaN(index)) {
      return;
    }

    activeDp.internalFactors.splice(index, 1);
    renderInternalFactorsRows(activeDp.internalFactors);
  });

  saveRequestBtnEl.addEventListener('click', async function() {
    this.disabled = true;
    this.textContent = 'Saving...';

    const result = await persistActiveDecisionProblem();
    if (result.saved) {
      showSaveStatus(`Decision problem saved with ID ${result.id}. Open Query Center to run a query against it.`, false);
    } else {
      showSaveStatus(`Failed to save decision problem: ${result.reason}`, true);
    }

    this.disabled = false;
    this.textContent = 'Save Decision Problem';
  });

  function togglePlainTextFactsPanel(show) {
    if (show == null) {
      show = !plainTextFactorsPanelEl.classList.contains('active');
    }
    if (show) {
      plainTextFactorsPanelEl.classList.add('active');
      togglePlainTextFactorsBtnEl.textContent = 'Hide plain text input';
      plainTextFactorsInputEl.focus();
    } else {
      plainTextFactorsPanelEl.classList.remove('active');
      togglePlainTextFactorsBtnEl.textContent = 'Enter plain text';
    }
  }

  function applyPlainTextFacts() {
    const activeDp = getActiveDecisionProblem();
    if (!activeDp) {
      return;
    }

    const lines = plainTextFactorsInputEl.value
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => line);

    if (lines.length === 0) {
      showSaveStatus('Paste at least one factor before importing.', true);
      return;
    }

    activeDp.externalFactors = lines.map(line => ({ fact: line, factHold: false, factStatus: 'unknown', factType: 'external' }));
    renderExternalFactorsRows(activeDp.externalFactors);
    togglePlainTextFactorsPanel(false);
    plainTextFactorsInputEl.value = '';
  }

  togglePlainTextFactorsBtnEl.addEventListener('click', function() {
    captureFormIntoActiveDecisionProblem();
    togglePlainTextFactsPanel();
  });

  applyPlainTextFactorsBtnEl.addEventListener('click', applyPlainTextFacts);
  cancelPlainTextFactorsBtnEl.addEventListener('click', function() {
    plainTextFactorsInputEl.value = '';
    togglePlainTextFactorsPanel(false);
  });

  goToQueryCenterBtnEl.addEventListener('click', autoSaveAndNavigateToQueryCenter);
  previewDpBtnEl.addEventListener('click', showDecisionProblemPreview);
  closePreviewBtnEl.addEventListener('click', hideDecisionProblemPreview);
  dpPreviewBackdropEl.addEventListener('click', function(event) {
    if (event.target === dpPreviewBackdropEl) {
      hideDecisionProblemPreview();
    }
  });

  openQueryCenterLinkEl.addEventListener('click', async function(event) {
    event.preventDefault();
    await autoSaveAndNavigateToQueryCenter();
  });

  // Load stored requests from database on page load
  (async function initializePage() {
    await loadStoredRequestsFromDatabase();
    // If no stored requests, create a new one
    if (decisionProblems.length === 0) {
      createAndActivateDecisionProblem();
    }
  })();
</script>
</body>
</html>
