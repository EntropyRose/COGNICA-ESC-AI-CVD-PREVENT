# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application
spring.application.name=Cognica Decision Support API

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true

# Primary Database (cognica_db) — main decision problems
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/cognica_db
spring.datasource.username=${DB_USERNAME:Ctzio}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Clinical Database (cognica_clinical_db) — clinical DPs, fact-free, clinical system only
clinical.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/cognica_clinical_db
clinical.datasource.username=${DB_USERNAME:Ctzio}
clinical.datasource.password=${DB_PASSWORD}
clinical.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate — applied explicitly in PrimaryDataSourceConfig and ClinicalDataSourceConfig
spring.jpa.open-in-view=false

# Cognica API Configuration
# Use environment variables for credentials in production
cognica.api.url=https://cognica.cs.ucy.ac.cy/COGNICAd/api.php
cognica.api.username=${COGNICA_USERNAME:username}
cognica.api.password=${COGNICA_PASSWORD:password}